<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-label="Learning timeline: Intermediate in Computer Science 2020 to 2022, Bachelor of Software Engineering 2022 to 2026">
  <title>Learning timeline: Intermediate in Computer Science 2020 to 2022, Bachelor of Software Engineering 2022 to 2026</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset=".55" stop-color="#151a3d"/><stop offset="1" stop-color="#0a1c2b"/>
    </linearGradient>
    <linearGradient id="gt1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="gt2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    @keyframes grow { from { transform: scaleX(0); } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    .rise { animation: rise .8s ease-out both; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.3s ease-out both; }
  </style>
  <rect x="1" y="1" width="1198" height="308" rx="22" fill="url(#bg)" stroke="url(#g)" stroke-width="1.5"/>
  <line x1="120" y1="30" x2="120" y2="252" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="120" y="280" text-anchor="middle" font-size="15" fill="#9aa6c7">2020</text>
  <line x1="280" y1="30" x2="280" y2="252" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="280" y="280" text-anchor="middle" font-size="15" fill="#9aa6c7">2021</text>
  <line x1="440" y1="30" x2="440" y2="252" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="440" y="280" text-anchor="middle" font-size="15" fill="#9aa6c7">2022</text>
  <line x1="600" y1="30" x2="600" y2="252" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="600" y="280" text-anchor="middle" font-size="15" fill="#9aa6c7">2023</text>
  <line x1="760" y1="30" x2="760" y2="252" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="760" y="280" text-anchor="middle" font-size="15" fill="#9aa6c7">2024</text>
  <line x1="920" y1="30" x2="920" y2="252" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="920" y="280" text-anchor="middle" font-size="15" fill="#9aa6c7">2025</text>
  <line x1="1080" y1="30" x2="1080" y2="252" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="1080" y="280" text-anchor="middle" font-size="15" fill="#9aa6c7">2026</text>
  <g class="rise" style="animation-delay:0.3s">
    <text x="120" y="52" font-size="21" font-weight="700" fill="#eef1ff">Intermediate in Computer Science</text>
    <rect class="bar" style="animation-delay:0.3s" x="120" y="64" width="320" height="30" rx="15" fill="url(#gt1)"/>
    <text x="280.0" y="85" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2020 – 2022</text>
    <text x="120" y="118" font-size="15" fill="#9aa6c7">Govt. Women College (BISE Sahiwal)</text>
  </g>
  <g class="rise" style="animation-delay:1.1s">
    <text x="440" y="152" font-size="21" font-weight="700" fill="#eef1ff">Bachelor of Software Engineering</text>
    <rect class="bar" style="animation-delay:1.1s" x="440" y="164" width="640" height="30" rx="15" fill="url(#gt2)"/>
    <text x="760.0" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2022 – 2026</text>
    <text x="440" y="218" font-size="15" fill="#9aa6c7">GCUF Sahiwal Campus</text>
  </g>
</svg>
