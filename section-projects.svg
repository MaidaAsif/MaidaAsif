<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-label="Section: Projects">
  <title>Section: Projects</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset=".55" stop-color="#151a3d"/><stop offset="1" stop-color="#0a1c2b"/>
    </linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#3b82f6"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#3b82f6"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    @keyframes grow { from { transform: scaleX(0); } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    .rise { animation: rise .8s ease-out both; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
  <rect x="1" y="1" width="1198" height="62" rx="16" fill="url(#bg)" stroke="url(#g)" stroke-width="1.2" stroke-opacity=".8"/>
  <rect x="26" y="16" width="6" height="32" rx="3" fill="url(#g)"/>
  <text class="rise" x="50" y="43" font-size="27" font-weight="700" fill="#f1f4ff">Projects</text>
  <circle cx="1130" cy="32" r="5" fill="#3b82f6" style="animation:pulse 2s ease-in-out infinite"/>
  <circle cx="1150" cy="32" r="5" fill="#8b5cf6" style="animation:pulse 2s ease-in-out .3s infinite"/>
  <circle cx="1170" cy="32" r="5" fill="#14b8a6" style="animation:pulse 2s ease-in-out .6s infinite"/>
  <rect x="26" y="57" width="1148" height="2" rx="1" fill="url(#shine)"/>
</svg>
